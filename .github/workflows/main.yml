name: Generate Datas

on:
  schedule:
    - cron: "0 */12 * * *" # a cada 12 horas (antes rodava a cada minuto nas horas 0 e 12)
  workflow_dispatch:      # permite rodar manualmente em Actions > Run workflow

permissions:
  contents: write # necessário para publicar no branch "output"

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    steps:
      # Cobrinha das contribuições (versão clara e escura)
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Cards do GitHub Readme Stats gerados aqui mesmo
      # (o servidor público github-readme-stats.vercel.app vive fora do ar por limite de uso)
      - name: Card de estatísticas
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=radical&include_all_commits=true&count_private=true
          path: dist/stats.svg
          # Para contar repositórios privados, crie o secret STATS_TOKEN com um PAT (escopos repo e read:user)
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Card de linguagens
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=tokyonight
          path: dist/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      # Publica tudo em dist/ no branch "output"
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
